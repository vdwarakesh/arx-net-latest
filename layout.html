<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resizable Layout</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="css/containers-cards.css">
    <link rel="stylesheet" href="css/resize-divider.css">
    <link rel="stylesheet" href="css/scrollbars.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/popover.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="layout" id="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <img class="icon" src="images/logo.png" id="logo" alt="">
            <img class="icon" src="images/new.png" id="btn-new" alt="">
            <img class="icon" src="images/list.png" id="btn-list" alt="">
            <img class="icon" src="images/profile.png" id="btn-settings" alt="">
        </div>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- MULTI VIEW (Grid of containers) -->
            <div id="multi-view" class="view-panel grid-view hidden">
                <!-- Containers generated by JS go here -->
            </div>

            <!-- FOCUSED VIEW (One container + Algorithm block) -->
            <div id="focused-view" class="view-panel">
                <!-- Shown instead of the two panes below when nothing is focused; see ViewManager.js -->
                <div id="empty-state" class="empty-state">
                    <div class="empty-state-title">Arx Net</div>
                    <div class="empty-state-subtitle">VISUALIZATION DONE DIFFERENTLY</div>
                </div>

                <div id="focused-container-slot">
                    <!-- The currently focused container is inserted here by ViewManager,
                         always before the metadata card below so it stays on top. -->

                    <div class="card metadata" id="metadataCard">
                        <div class="card-header">Object metadata</div>
                        <div class="card-body">
                            <p>Name: <span id="metadata-name-value">—</span></p>
                        </div>
                    </div>
                </div>
                
                <div class="algorithm" id="algorithm">
                    <div class="card code" id="codeCard">
                        <div class="card-header">
                            <select data-custom-select>
                                <option> C++ </option>
                                <option> Python </option>
                                <option> Java </option>
                            </select>
                            Explanation Notes
                        </div>
                        <div class="card-body">
                            <p>Code section content goes here.</p>
                        </div>
                    </div>

                    <div class="divider-h" id="dividerH"></div>

                    <div class="card traversal" id="traversalCard">
                        <div class="card-header">Traversal</div>
                        <div class="card-body">
                            <p>Traversal section content goes here.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Template for generating new containers -->
    <template id="container-template">
        <div class="container">
            <div class="container-header">
                <span class="container-title">Container</span>
                <div class="header-actions">
                    <img class="icon focus-btn" src="images/focus.png" alt="">
                    <img class="icon delete-btn" src="images/delete.png" alt="">
                </div>
            </div>
            <div class="container-body">
                <p>Main content area.</p>
            </div>
        </div>
    </template>

    <!-- type="module" gives each file in js/ its own scope, so nothing in
         there leaks into the global `window` object. See js/main.js. -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
