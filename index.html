<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resizable Layout</title>

    <!-- Loaded in cascade order: tokens/base first, components next, responsive overrides last. -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="css/containers-cards.css">
    <link rel="stylesheet" href="css/custom-select.css">
    <link rel="stylesheet" href="css/resize-divider.css">
    <link rel="stylesheet" href="css/scrollbars.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/popover.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="layout" id="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <img class="icon" src="images/logo.png" id="logo" alt="">
            <img class="icon" src="images/new.png" id="btn-new" alt="">
            <img class="icon" src="images/list.png" id="btn-list" alt="">
            <img class="icon" src="images/profile.png" id="btn-settings" alt="">
        </div>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- MULTI VIEW (Grid of containers) -->
            <div id="multi-view" class="view-panel grid-view hidden">
                <!-- Containers generated by JS go here -->
            </div>

            <!-- FOCUSED VIEW (One container + Algorithm block) -->
            <div id="focused-view" class="view-panel">
                <!-- Shown instead of the two panes below when nothing is focused; see ViewManager.js -->
                <div id="empty-state" class="empty-state">
                    <div class="empty-state-title">Arx Net</div>
                    <div class="empty-state-subtitle">VISUALIZATION DONE DIFFERENTLY</div>
                </div>

                <div id="focused-container-slot">
                    <!-- The currently focused container is inserted here by ViewManager,
                         always before the divider below so it stays on top. -->

                    <div class="divider-h" id="metadataDividerH"></div>

                    <div class="card metadata" id="metadataCard">
                        <div class="card-header">Object metadata</div>
                        <div class="card-body">
                            <p>Name: <span id="metadata-name-value">—</span></p>
                        </div>
                    </div>
                </div>
                
                <div class="algorithm" id="algorithm">
                    <!--
                        CODE and EXPLANATION are two separate cards (see
                        #explanationCard below), not one card with two
                        panels — but their header markup is deliberately
                        duplicated so both always show the same Code /
                        language / Explanation controls, regardless of
                        which card is currently visible. js/CodePanel.js
                        is the only thing that knows there are two of them.
                    -->
                    <div class="card code" id="codeCard">
                        <div class="card-header code-header">
                            <div class="code-tabs">
                                <button type="button" class="code-tab active" data-tab="code">Code</button>
                                <!-- Sibling of the Code tab, not nested inside it — so changing the
                                     language can never also trigger a tab switch. Placed right next
                                     to Code for easy access, rather than off at the header's far edge. -->
                                <select class="language-select">
                                    <option value="cpp">C++</option>
                                    <option value="python">Python</option>
                                    <option value="java">Java</option>
                                </select>
                                <button type="button" class="code-tab" data-tab="explanation">Explanation</button>
                                <!-- No data-tab, and deliberately not picked up by CodePanel.js —
                                     styled like the other tabs but does nothing when clicked yet. -->
                                <button type="button" class="code-tab">Notes</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <p>Code section content goes here.</p>
                        </div>
                    </div>

                    <div class="card code explanation" id="explanationCard">
                        <div class="card-header code-header">
                            <div class="code-tabs">
                                <button type="button" class="code-tab" data-tab="code">Code</button>
                                <select class="language-select">
                                    <option value="cpp">C++</option>
                                    <option value="python">Python</option>
                                    <option value="java">Java</option>
                                </select>
                                <button type="button" class="code-tab active" data-tab="explanation">Explanation</button>
                                <button type="button" class="code-tab">Notes</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <p>Explanation section content goes here.</p>
                        </div>
                    </div>

                    <div class="divider-h" id="dividerH"></div>

                    <!-- Traversal (60%) + State variables (40%), side by side.
                         Hidden entirely while Explanation is active — see
                         css/views.css's .explanation-active rules. -->
                    <div class="traversal-row" id="traversalRow">
                        <div class="card traversal" id="traversalCard">
                            <div class="card-header">Traversal</div>
                            <div class="card-body">
                                <p>Traversal section content goes here.</p>
                            </div>
                        </div>

                        <!-- Horizontal drag handle — see css/resize-divider.css's .divider-v
                             and js/initTraversalResize.js. Minimum width on both sides is
                             3rem; at that minimum a card's header rotates into a vertical
                             tab (see the .collapsed rules in css/containers-cards.css). -->
                        <div class="divider-v" id="dividerV"></div>

                        <div class="card state-variables" id="stateVariablesCard">
                            <div class="card-header">State variables</div>
                            <div class="card-body">
                                <p>State variables content goes here.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Template for generating new containers -->
    <template id="container-template">
        <div class="container">
            <div class="container-header">
                <span class="container-title">Container</span>
                <div class="header-actions">
                    <img class="header-icon focus-btn" src="images/focus.png" alt="">
                    <!-- Delete button intentionally removed — see Container.js and
                         ContainerRegistry.confirmDelete() for why the underlying
                         delete mechanism is still fully intact and ready to wire
                         up to whatever replaces this. -->
                </div>
            </div>
            <div class="container-body">
                <p>Main content area.</p>
            </div>
        </div>
    </template>

    <!-- type="module" gives each file in js/ its own scope, so nothing in
         there leaks into the global `window` object. See js/main.js. -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
